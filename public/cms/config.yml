backend:
  name: github
  repo: akinyodeolamide/fashion-house-v3
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - label: "Products"
        name: "products"
        file: "app/data/products.json"
        fields:
          - name: "products"
            label: "Products"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Price (₦)", name: "price", widget: "number", value_type: "int" }
              - { label: "Show Price", name: "showPrice", widget: "boolean", default: true }
              - { label: "Starting From", name: "startingFrom", widget: "boolean", default: false }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Category Slug", name: "categorySlug", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Short Description", name: "shortDescription", widget: "text" }
              - name: "images"
                label: "Images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - name: "videos"
                label: "Videos"
                widget: "list"
                field: { label: "Video", name: "video", widget: "file" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Created At", name: "createdAt", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Updated At", name: "updatedAt", widget: "date", format: "YYYY-MM-DD" }

  - name: "posts"
    label: "Latest Creations"
    files:
      - label: "Posts"
        name: "posts"
        file: "app/data/posts.json"
        fields:
          - name: "posts"
            label: "Posts"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Caption", name: "caption", widget: "text" }
              - name: "images"
                label: "Images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - name: "videos"
                label: "Videos"
                widget: "list"
                field: { label: "Video", name: "video", widget: "file" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - name: "tags"
                label: "Tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }

  - name: "categories"
    label: "Categories"
    files:
      - label: "Categories"
        name: "categories"
        file: "app/data/categories.json"
        fields:
          - name: "categories"
            label: "Categories"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Product Count", name: "productCount", widget: "number", value_type: "int" }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - label: "Testimonials"
        name: "testimonials"
        file: "app/data/testimonials.json"
        fields:
          - name: "testimonials"
            label: "Testimonials"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Rating", name: "rating", widget: "number", value_type: "int" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }

  - name: "archive"
    label: "Fashion Archive"
    files:
      - label: "Archive"
        name: "archive"
        file: "app/data/archive.json"
        fields:
          - name: "archive"
            label: "Archive Items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["before-after", "client-outfit", "fashion-shoot", "video", "process"] }
              - name: "images"
                label: "Images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Video", name: "video", widget: "file", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - name: "tags"
                label: "Tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }

  - name: "stats"
    label: "Trust Stats"
    files:
      - label: "Stats"
        name: "stats"
        file: "app/data/stats.json"
        fields:
          - name: "stats"
            label: "Statistics"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Suffix", name: "suffix", widget: "string" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "app/data/settings.json"
        fields:
          - name: "settings"
            label: "Settings"
            widget: "object"
            fields:
              - { label: "Brand Name", name: "brandName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "WhatsApp", name: "whatsapp", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Business Hours", name: "businessHours", widget: "string" }
              - { label: "Hero Headline", name: "heroHeadline", widget: "string" }
              - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
              - { label: "SEO Title", name: "seoTitle", widget: "string" }
              - { label: "SEO Description", name: "seoDescription", widget: "text" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
              - { label: "TikTok", name: "tiktok", widget: "string" }
              - { label: "Google Maps Embed", name: "googleMapsEmbed", widget: "text" }
