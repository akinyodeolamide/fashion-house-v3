backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "app/data"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Price", name: "price", widget: "number" }
      - { label: "Show Price", name: "showPrice", widget: "boolean", default: true }
      - { label: "Starting From", name: "startingFrom", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Category Slug", name: "categorySlug", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Short Description", name: "shortDescription", widget: "text" }
      - { label: "Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Videos", name: "videos", widget: "list", field: { label: "Video", name: "video", widget: "file" } }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "posts"
    label: "Latest Creations"
    folder: "app/data/posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Caption", name: "caption", widget: "text" }
      - { label: "Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean" }
      - { label: "Tags", name: "tags", widget: "list" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "app/data/settings.json"
        fields:
          - { label: "Brand Name", name: "brandName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Business Hours", name: "businessHours", widget: "string" }
          - { label: "Hero Headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero Subheading", name: "heroSubheading", widget: "text" }
